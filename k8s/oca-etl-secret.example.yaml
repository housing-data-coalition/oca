# Example Secret for oca-etl CronJob. Do not commit real credentials.
#
#   kubectl create secret generic oca-etl-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=AWS_ACCESS_KEY_ID='...' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='...' \
#     --from-literal=AWS_S3_BUCKET_NAME='oca-2-dev' \
#     --from-literal=SFTP_HOST='sftp.nycourts.gov' \
#     --from-literal=SFTP_USER='...' \
#     --from-literal=SFTP_PSWD='...' \
#     --from-literal=SFTP_DIR='139'
#
# Or apply this template after replacing placeholders:
apiVersion: v1
kind: Secret
metadata:
  name: oca-etl-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/DATABASE"
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_S3_BUCKET_NAME: "oca-2-dev"
  SFTP_HOST: "sftp.nycourts.gov"
  SFTP_USER: "REPLACE_ME"
  SFTP_PSWD: "REPLACE_ME"
  SFTP_DIR: "139"
